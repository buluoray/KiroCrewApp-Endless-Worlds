# Lint + type config for the dev-only screenshot harness.
#
# Same conservative rule set as backend/pyproject.toml, so one habit covers both
# trees. CI runs (see .github/workflows/ci.yml):
#   ruff check devtools && ruff format --check devtools && mypy devtools
#
# This tool is not shipped with the app, but it is read and edited like source, so it
# is gated like source.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Line width is the formatter's job; a long URL or string it cannot split would
    # otherwise trip E501 with no clean fix.
    "E501",
    "B008",
    "B905",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = false

# The app's backend modules ARE resolvable, and must be: this harness drives them,
# so a call into one is the main thing worth type-checking here. They are not a
# package, so CI puts them on `MYPYPATH` (see the devtools step in
# .github/workflows/ci.yml) exactly as the harness itself puts them on `sys.path`.
# They were listed here as unresolvable, which is what let every call into them go
# unchecked as `Any`.
#
# What genuinely has no stubs is the host gateway package. Listed for the reader, and
# the same shape backend/pyproject.toml uses; the blanket
# `ignore_missing_imports` above is what actually answers for it.
[[tool.mypy.overrides]]
module = ["kiro_crew.*"]
ignore_missing_imports = true
