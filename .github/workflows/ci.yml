name: CI

# Basic CI: the full test suite, and a UI build that must reproduce the committed
# bundle, on every push to main and every PR into it. No agent/LLM review here.
#
# There is deliberately NO version gate. `app.json`'s version says "this is worth
# installing", which is a judgement about a body of work — not a side effect of
# touching a shipped file. Requiring it per pull request made every branch edit the
# same line (a guaranteed conflict between concurrent work) and, worse, marched the
# version forward over commits nobody had decided to ship. Bump it deliberately
# when cutting a version; day to day, reinstall the app instead.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SVG preview renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends librsvg2-2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The suite tests against the REAL host AppStorage rather than a stub
          # (see backend/tests/conftest.py), so the gateway package must be
          # importable. It is not published to PyPI, so install it from its
          # public source; this also pulls the runtime deps the backend imports
          # (aiohttp, etc.). pytest itself is the only extra.
          pip install pytest pillow vtracer
          pip install "git+https://github.com/kirodotdev/KiroCrew.git"

      - name: Run full backend test suite
        working-directory: backend
        run: python -m pytest tests -q

  backend-lint:
    name: Backend lint + types (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          # Ruff (lint + format) and mypy only. The gate is intentionally
          # host-package-free: backend/pyproject.toml sets ignore_missing_imports
          # (and treats the kiro_crew.* namespace as untyped), so neither the
          # gateway package nor the runtime deps need installing to type-check.
          pip install ruff mypy

      - name: Ruff lint
        working-directory: backend
        run: ruff check .

      - name: Ruff format check
        working-directory: backend
        run: ruff format --check .

      - name: Mypy (application modules)
        working-directory: backend
        run: mypy .

      # The dev screenshot harness is not shipped with the app, but it is read and
      # edited like source and it drives the app's real writers — a rotted harness
      # costs an afternoon at exactly the moment someone reaches for it. Its own
      # pyproject.toml carries the same conservative rule set as the backend's.
      - name: Ruff lint + format + mypy (devtools)
        working-directory: devtools
        run: |
          ruff check .
          ruff format --check .
          mypy .

  ui-shots:
    name: UI shots (real instance)
    runs-on: ubuntu-latest
    # The gate the unit tests structurally cannot be: it installs this app into a
    # throwaway gateway, seeds fixture lives through the app's own writers, drives the
    # REAL dashboard in a browser and asserts where things landed. Every defect this
    # repo shipped to a player on the play surface was invisible to a test that did not
    # render it — a scene frame blank because a second authenticated request failed
    # unseen, a ledger empty from a stale compiled-bytes cache, a sheet that left the
    # story's widgets on screen underneath it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the host gateway
        # A RELEASED build, not a git source install: `pip install git+…KiroCrew` gives
        # the Python package WITHOUT the dashboard bundle (the SPA is built by that
        # repo's own build step and is not in the source tree), so the gateway comes up
        # and serves a "Dashboard HTML not found" page — every shot then photographs an
        # error page and the job burns half an hour before failing. The official
        # installer resolves the channel feed and installs a wheel that carries the
        # built dashboard. devtools/instance.py checks for that marker at startup, so
        # this can only ever fail fast now.
        #
        # kiro-cli is deliberately NOT installed: no shot starts an agent session, and
        # the gateway reaches ready and serves the dashboard without it.
        run: |
          curl -fsSL https://download.crew.kiro.dev/cli.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the browser driver
        working-directory: devtools
        run: |
          npm install --no-save
          npx playwright install --with-deps chromium

      - name: Bring up a seeded instance
        env:
          UISHOT_WORK: ${{ runner.temp }}/uishot
        run: python3 devtools/uishot.py up

      - name: Capture and assert every shot
        # Non-zero on a violated UI-position expectation, a failed step, a non-2xx app
        # request, or a request still pending — see devtools/shots.py for what each shot
        # claims and devtools/README.md for why the assertions are relationships rather
        # than pinned pixels.
        env:
          UISHOT_WORK: ${{ runner.temp }}/uishot
        run: python3 devtools/uishot.py review

      - name: Upload the contact sheets and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/uishot/shots
          if-no-files-found: warn

      - name: Tear down
        if: always()
        env:
          UISHOT_WORK: ${{ runner.temp }}/uishot
        run: python3 devtools/uishot.py down

  frontend-build:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint (React Rules of Hooks)
        # A narrow gate: react-hooks/rules-of-hooks is an error. A hook after an
        # early return (React #310, which crashed the Life Star Map) fails here
        # instead of shipping. See web/eslint.config.js.
        working-directory: web
        run: npm run lint

      - name: Format check (Prettier)
        # Fails if any web/src file is not Prettier-formatted. `npm run format`
        # (prettier --write src) fixes it locally. See web/.prettierrc and
        # web/.prettierignore (styles.css is excluded — it is inlined verbatim
        # into the committed bundle).
        working-directory: web
        run: npm run format:check

      - name: Typecheck and build
        working-directory: web
        run: npm run build

      # The half the pre-commit hook has always claimed CI enforces, and did not.
      # `ui/index.mjs` is COMMITTED because a registry install copies the repo as
      # it stands — nothing builds after checkout, so a stale artifact means the
      # installed app runs older code than the commit claims. With no version gate
      # left, this is the only thing standing between a merge and that silence.
      #
      # A byte comparison is sound here because `npm ci` pins every dependency
      # from the lock file, and the bundle's bytes come from those (rollup,
      # esbuild), not from the Node minor.
      - name: The committed bundle must match a fresh build
        run: |
          if ! git diff --quiet -- ui/index.mjs; then
            echo "::error::ui/index.mjs is stale. Run 'cd web && npm run build' and commit the result (or enable the hook: git config core.hooksPath .githooks)."
            git diff --stat -- ui/index.mjs
            exit 1
          fi
