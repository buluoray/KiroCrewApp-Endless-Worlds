<!-- Endless Worlds rail glyph: the store emblem redrawn as single-colour stroke
     geometry so it repaints from currentColor. Deliberately NOT a trace of the
     logo — at the ~20px the rail renders, a 1.35px stroke leaves concentric
     spiral turns about 2px of radial room, so the emblem's ~2.5 turns and its
     closed leaf shapes would fill in solid. The coil keeps one open turn, the
     wave leaves it at the bottom and lifts into the tree's root, and the canopy
     is branch strokes rather than leaf outlines. -->
